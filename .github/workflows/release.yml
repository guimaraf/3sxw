name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y $(cat tools/requirements-ubuntu.txt)
          bash ./scripts/build/build-deps-linux.sh
        shell: bash

      - name: Build
        run: |
          set -o pipefail
          CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2>&1 | tee build.log
        shell: bash

      - name: Install
        run: cmake --install build --prefix dist
        shell: bash

      - name: Package TGZ
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          ARCHIVE_NAME="3SX-${SHORT_SHA}-linux.tar.gz"
          tar -C dist -czf "${ARCHIVE_NAME}" .
        shell: bash

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: |
            3SX-*-linux.tar.gz

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: build.log

  build_macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: bash ./scripts/build/build-deps-macos.sh

      - name: Build
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2>&1 | tee build.log
        shell: bash

      - name: Package DragNDrop DMG
        run: |
          set -euo pipefail
          cpack -G DragNDrop --config build/CPackConfig.cmake

          DMG_PATH="$(find . -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [ -z "${DMG_PATH}" ]; then
            echo "No .dmg package found in build/"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          DMG_NAME="3SX-${SHORT_SHA}-macos.dmg"
          mv "${DMG_PATH}" "${DMG_NAME}"
        shell: bash

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            3SX-*-macos.dmg

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-macos
          path: build.log

  build_windows:
    name: Build Windows
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install MSYS2 packages
        run: tr -d '\r' < tools/requirements-windows.txt | xargs pacman -S --needed --noconfirm

      - name: Build dependencies
        run: bash ./scripts/build/build-deps-windows.sh

      - name: Build
        run: |
          set -o pipefail

          CC=clang CXX=clang++ cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}

          cmake --build build --parallel 2>&1 | tee build.log

      - name: Install
        run: cmake --install build --prefix dist

      - name: Package ZIP
        shell: pwsh
        run: |
          $shortSha = "${env:GITHUB_SHA}".Substring(0, 7)
          $archiveName = "3SX-$shortSha-windows.zip"

          Compress-Archive -Path "dist\*" -DestinationPath $archiveName -Force

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            3SX-*-windows.zip

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build.log

  build_uwp:
    name: Build Xbox UWP
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 80f9bcfa455e875d9c1bf7a7c6692d7e1e481061
          path: .vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ runner.os }}-uwp-vcpkg-${{ hashFiles('ports/uwp/vcpkg.json') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force $binaryCache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File $env:GITHUB_ENV -Append
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Prepare signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.XBOX_UWP_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.XBOX_UWP_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
              throw "XBOX_UWP_SIGNING_CERTIFICATE is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
              throw "XBOX_UWP_SIGNING_PASSWORD is not configured."
          }

          $pfx = Join-Path $env:RUNNER_TEMP "3sxw-uwp.pfx"
          "UWP_PFX=$pfx" | Out-File $env:GITHUB_ENV -Append
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfx, $env:CERTIFICATE_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) {
              throw "XBOX_UWP_SIGNING_CERTIFICATE does not contain a private key."
          }
          if ($cert.Subject -ne "CN=3SXW") {
              throw "The signing certificate subject must be CN=3SXW."
          }

          $cer = Join-Path $env:RUNNER_TEMP "3sxw-uwp.cer"
          [IO.File]::WriteAllBytes(
              $cer,
              $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          "UWP_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append

      - name: Build Xbox UWP package
        shell: pwsh
        run: .\scripts\build\build-uwp.ps1 -Configuration Release

      - name: Sign and stage Xbox UWP release
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.XBOX_UWP_SIGNING_PASSWORD }}
        run: |
          $shortSha = "${env:GITHUB_SHA}".Substring(0, 7)
          .\scripts\build\sign-uwp.ps1 `
            -CertificatePath $env:UWP_PFX `
            -CertificatePassword $env:CERTIFICATE_PASSWORD `
            -ArchiveName "3SX-$shortSha-xbox-uwp"

      - name: Upload Xbox UWP release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-uwp
          path: dist/xbox-uwp/3SX-*-xbox-uwp.zip
          if-no-files-found: error

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:UWP_CERT_THUMBPRINT) {
              Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:UWP_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
          }
          if ($env:UWP_PFX) {
              Remove-Item $env:UWP_PFX -Force -ErrorAction SilentlyContinue
          }

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build_linux
      - build_macos
      - build_windows
      - build_uwp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Move rolling release tag to current commit
        env:
          TAG_NAME: rolling-pre-release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG_NAME}" --force

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: rolling-pre-release
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:7}"

          touch notes.md
          echo "Automatic release for commit ${FULL_SHA}" >> notes.md
          echo >> notes.md
          echo "⚠️ **Disclaimer** ⚠️: This is a __pre-release__ build. Expect bugs and instability." >> notes.md

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${SHORT_SHA}" \
              --prerelease \
              --notes-file notes.md

            for asset in $(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name'); do
              gh release delete-asset "${TAG_NAME}" "${asset}" --yes
            done

            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            gh release create "${TAG_NAME}" release-assets/* \
              --title "${SHORT_SHA}" \
              --prerelease \
              --notes-file notes.md
          fi
