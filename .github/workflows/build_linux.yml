name: Build (Linux)

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
            with:
                submodules: true

          - name: Cache dependencies
            uses: actions/cache@v4
            with:
                path: third_party
                key: ${{ runner.os }}-deps-${{ hashFiles('build-deps.sh', 'scripts/build/build-deps-common.sh', 'scripts/build/build-deps-linux.sh') }}

          - name: Install dependencies
            run: |
                sudo apt update
                sudo apt install -y $(cat tools/requirements-ubuntu.txt)
                bash ./scripts/build/build-deps-linux.sh
            shell: bash

          - name: Build for Linux
            run: |
                set -o pipefail
                CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Release
                cmake --build build --parallel 2>&1 | tee build.log
            shell: bash

          - name: Install portable Linux application
            run: cmake --install build --prefix build/application
            shell: bash

          - name: Upload portable Linux application
            uses: actions/upload-artifact@v4
            with:
                name: 3SXW-Linux
                path: build/application
                if-no-files-found: error

          - name: Upload build log
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: build-log
                path: build.log
