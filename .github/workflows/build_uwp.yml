name: Build (UWP / Xbox)

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    build:
        runs-on: windows-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
            with:
                submodules: true

          - name: Install vcpkg dependencies
            run: |
              vcpkg install sdl3 ffmpeg[core,swscale,swresample] minizip zlib mbedtls --triplet x64-uwp
            shell: pwsh

          - name: Configure CMake
            run: |
              cmake -B build -G "Visual Studio 17 2022" -A x64 \
                -DCMAKE_SYSTEM_NAME=WindowsStore \
                -DCMAKE_SYSTEM_VERSION="10.0" \
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_BUILD_TYPE=Release
            shell: pwsh

          - name: Build
            run: |
              cmake --build build --config Release --parallel
            shell: pwsh

          - name: Add MSBuild to PATH
            uses: microsoft/setup-msbuild@v2

          - name: Create self-signed certificate
            run: |
              $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=3SXW" -KeyUsage DigitalSignature -FriendlyName "3SXW UWP Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
              $pwd = ConvertTo-SecureString -String "3sxw" -Force -AsPlainText
              Export-PfxCertificate -Cert $cert -FilePath "3SXW.pfx" -Password $pwd
            shell: pwsh

          - name: Package AppX
            run: |
              mkdir AppXStaging
              Copy-Item "build\Release\SF3.exe" -Destination "AppXStaging\"
              Copy-Item "build\Release\*.dll" -Destination "AppXStaging\" -ErrorAction SilentlyContinue
              
              if (Test-Path "build\SF3\AppxManifest.xml") {
                  Copy-Item "build\SF3\AppxManifest.xml" -Destination "AppXStaging\"
              } else {
                  $manifest = @"
              <?xml version="1.0" encoding="utf-8"?>
              <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                       xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">
                <Identity Name="3SXW" Publisher="CN=3SXW" Version="1.0.0.0" ProcessorArchitecture="x64" />
                <Properties>
                  <DisplayName>3SXW</DisplayName>
                  <PublisherDisplayName>3SXW</PublisherDisplayName>
                  <Logo>Assets\StoreLogo.png</Logo>
                </Properties>
                <Dependencies>
                  <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.19041.0" MaxVersionTested="10.0.19041.0" />
                </Dependencies>
                <Resources>
                  <Resource Language="en-us" />
                </Resources>
                <Applications>
                  <Application Id="App" Executable="SF3.exe" EntryPoint="SF3.App">
                    <uap:VisualElements DisplayName="3SXW" Description="3SXW UWP" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                      <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
                      <uap:SplashScreen Image="Assets\SplashScreen.png" />
                    </uap:VisualElements>
                  </Application>
                </Applications>
              </Package>
              "@
                  Out-File -FilePath "AppXStaging\AppxManifest.xml" -InputObject $manifest -Encoding utf8
                  
                  mkdir "AppXStaging\Assets"
                  Copy-Item "src\sf3.ico" "AppXStaging\Assets\StoreLogo.png" -ErrorAction SilentlyContinue
                  Copy-Item "src\sf3.ico" "AppXStaging\Assets\Square150x150Logo.png" -ErrorAction SilentlyContinue
                  Copy-Item "src\sf3.ico" "AppXStaging\Assets\Square44x44Logo.png" -ErrorAction SilentlyContinue
                  Copy-Item "src\sf3.ico" "AppXStaging\Assets\Wide310x150Logo.png" -ErrorAction SilentlyContinue
                  Copy-Item "src\sf3.ico" "AppXStaging\Assets\SplashScreen.png" -ErrorAction SilentlyContinue
              }
              
              MakeAppx pack /d AppXStaging /p 3SXW_UWP_x64.msix
              SignTool sign /fd SHA256 /a /f 3SXW.pfx /p "3sxw" 3SXW_UWP_x64.msix
            shell: pwsh

          - name: Upload UWP Package
            uses: actions/upload-artifact@v4
            with:
                name: 3SXW-UWP-x64
                path: 3SXW_UWP_x64.msix
                if-no-files-found: error
